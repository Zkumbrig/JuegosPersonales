# Fly.io. Cambia el nombre de la app (debe ser único en Fly) antes de `fly launch --copy-config`.
# Importante: una sola máquina siempre encendida (las mesas viven en su memoria) y un volumen para /data.
app = "royale-club-CAMBIA-ESTE-NOMBRE"
primary_region = "mad"

[build]

[env]
  PORT = "8080"
  TRUST_PROXY = "1"
  DATA_FILE = "/data/rooms.json"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"

[[mounts]]
  source = "royale_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
